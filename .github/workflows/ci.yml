name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest tests/ -v --tb=short
      - name: Demo runs stay healthy
        run: |
          python -m derivatives_strategies run --out /tmp/ds_out
          python -m derivatives_strategies run \
            --data examples/data \
            --policy examples/policy.example.yml \
            --positions examples/positions.example.json \
            --as-of 2025-01-15 \
            --out /tmp/ds_csv_out
          python -m lsto_workforce demo --out /tmp/wf_out
          python -m lsto_workforce verify-ledger /tmp/wf_out/workforce_ledger.jsonl
