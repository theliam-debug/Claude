[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "derivatives_strategies"
version = "3.0.0"
description = "Institutional, Policy-Driven Options Overlay Toolkit"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Derivatives Strategies Team"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.6",
]

[project.scripts]
ds3 = "derivatives_strategies.engine.runner:run_cli"

[project.urls]
Homepage = "https://github.com/example/derivatives_strategies"
Documentation = "https://github.com/example/derivatives_strategies#readme"

[tool.setuptools.packages.find]
exclude = ["tests*", "examples*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# Pyflakes (F) plus core pycodestyle errors/warnings (E4/E7/E9/W). Kept lean so
# the lint gate stays meaningful and green; code formatting and import sorting
# are intentionally not enforced to avoid large, churny rewrites.
select = ["E4", "E7", "E9", "F", "W"]
