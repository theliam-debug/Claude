[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lsto-toolkit"
version = "3.1.0"
description = "LsTo decision-support toolkit: governed agent workforce + policy-driven options overlay analytics"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "LsTo"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
ds3 = "derivatives_strategies.engine.runner:run_cli"
lsto-workforce = "lsto_workforce.__main__:main"

[project.urls]
Homepage = "https://github.com/theliam-debug/Claude"
Documentation = "https://github.com/theliam-debug/Claude#readme"

[tool.setuptools.packages.find]
# Explicit include list: namespace-mode discovery previously swept any
# stray root directory (build/, out/) into the wheel.
include = ["derivatives_strategies*", "lsto_workforce*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
